    versao: 1
    tributo: TRANSICAO
    descricao: IPI pela TIPI vigente
    vigencia: { inicio: '2026-01-01', fim: '2026-12-31' }
    abrangencia: {}
    valor: { aliquota: '1' }
    fonte: { norma: 'Decreto 11.158/2022 (TIPI)', artigo: 'tabela' }

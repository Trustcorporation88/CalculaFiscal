# Parâmetros anuais da transição. Fatores e chaves (1 = vale, 0 = não vale), não alíquotas.
# Números de artigo do ADCT/EC 132 e da LC 214 (alterada pela LC 227/2026) ainda a conferir na íntegra.
regras:
  # --- CBS/IBS com efeito econômico (2026 é ano de teste: destaque compensado ou dispensado) ---
  - id: transicao.cbs-ibs-efeito
    versao: 1
    tributo: TRANSICAO
    descricao: CBS e IBS de 2026 sem efeito econômico (ano de teste)
    vigencia: { inicio: '2026-01-01', fim: '2026-12-31' }
    abrangencia: {}
    valor: { aliquota: '0' }
    fonte: { norma: 'EC 132/2023; LC 214/2025', artigo: 'ADCT art. 125; regras do ano de teste' }
    status: EM_VIGOR
    conferencia: CONFERIR
    observacao: 'Compensação com PIS/Cofins ou dispensa do recolhimento conforme cumprimento das obrigações acessórias'
  - id: transicao.cbs-ibs-efeito
    versao: 2
    tributo: TRANSICAO
    descricao: CBS e IBS com efeito econômico pleno
    vigencia: { inicio: '2027-01-01', fim: null }
    abrangencia: {}
    valor: { aliquota: '1' }
    fonte: { norma: 'EC 132/2023', artigo: 'ADCT arts. 126 e 127' }
    status: PUBLICADO_EFEITO_FUTURO
    conferencia: CONFERIR

  # --- PIS/Cofins ---
  - id: transicao.pis-cofins
    versao: 1
    tributo: TRANSICAO
    descricao: PIS e Cofins vigentes
    vigencia: { inicio: '2026-01-01', fim: '2026-12-31' }
    abrangencia: {}
    valor: { aliquota: '1' }
    fonte: { norma: 'Leis 10.637/2002 e 10.833/2003', artigo: 'regime atual' }
    status: EM_VIGOR
    conferencia: OK
  - id: transicao.pis-cofins
    versao: 2
    tributo: TRANSICAO
    descricao: PIS e Cofins extintos
    vigencia: { inicio: '2027-01-01', fim: null }
    abrangencia: {}
    valor: { aliquota: '0' }
    fonte: { norma: 'EC 132/2023', artigo: 'ADCT art. 126' }
    status: PUBLICADO_EFEITO_FUTURO
    conferencia: CONFERIR

  # --- IPI ---

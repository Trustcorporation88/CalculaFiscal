<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #fbfaf7;
      font-family: Arial, Helvetica, sans-serif;
      color: #14213d;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d6d3cc;
        border-radius: 10px;
        padding: 24px;
      "
    >
      <h1 style="font-size: 20px; margin: 0 0 16px">CalculaFiscal</h1>
      <p style="font-size: 16px; line-height: 1.5">
        Recebemos um pedido para trocar a senha da sua conta.
      </p>
      <p style="margin: 24px 0">
        <a
          href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery"
          style="
            background: #1f4e79;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
          "
          >Criar nova senha</a
        >
      </p>
      <p style="font-size: 13px; line-height: 1.5; color: #55607a">
        O link vale por 1 hora e só pode ser usado uma vez. Se você não pediu este e-mail, ignore-o.
      </p>
    </div>
  </body>
</html>
